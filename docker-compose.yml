services:
  api:
    build: .
    env_file: backend/.env
    environment:
      REDIS__URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - api-data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  api-data:
  redis-data:
